services:
  nginx:
    image: nginx:alpine
    container_name: webssh-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ttyd

  ttyd:
    build: .
    container_name: ttyd
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "7681"
    volumes:
      - ./launcher.sh:/usr/local/bin/launcher.sh:ro
      - ./data:/data
    command:
      - ttyd
      - -W
      - -t
      - copyOnSelect=true
      - /usr/local/bin/launcher.sh
