# Rotate container logs so long-running installs cannot fill the disk
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:alpine
    container_name: webssh-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    ports:
      - "${WEBSSH_BIND_IP:-127.0.0.1}:${WEBSSH_PORT:-8888}:8888"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ttyd
    logging: *default-logging

  ttyd:
    build: .
    container_name: ttyd
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Caps runaway process creation (fork bombs / many parallel sessions)
    pids_limit: 512
    expose:
      - "7681"
    volumes:
      - ./launcher.sh:/usr/local/bin/launcher.sh:ro
      - ./VERSION:/etc/webssh-version:ro
      - ./data:/data
    command:
      - ttyd
      - -W
      - -t
      - copyOnSelect=true
      - -t
      - scrollback=10000
      - -m
      - "10"
      - bash
      - /usr/local/bin/launcher.sh
    logging: *default-logging

  # Optional: Run Cloudflare Tunnel directly in Docker
  # Set TUNNEL_TOKEN in your .env file and run: docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: webssh-tunnel
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    network_mode: host
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    profiles:
      - tunnel
    logging: *default-logging
