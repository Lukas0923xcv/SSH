# Rotate container logs so long-running installs cannot fill the disk
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:alpine
    container_name: webssh-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    ports:
      - "${WEBSSH_BIND_IP:-127.0.0.1}:${WEBSSH_PORT:-8888}:8888"
    environment:
      # Rendered into the Host/Origin allowlists of nginx/default.conf.template
      - WEBSSH_PUBLIC_HOST=${WEBSSH_PUBLIC_HOST:-webssh.invalid}
      - WEBSSH_PORT=${WEBSSH_PORT:-8888}
      - NGINX_ENVSUBST_FILTER=^WEBSSH_
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/htpasswd:/etc/nginx/webssh.htpasswd:ro
    depends_on:
      - ttyd
    logging: *default-logging

  ttyd:
    build: .
    container_name: ttyd
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Caps runaway process creation (fork bombs / many parallel sessions)
    pids_limit: 512
    expose:
      - "7681"
    volumes:
      - ./launcher.sh:/usr/local/bin/launcher.sh:ro
      - ./VERSION:/etc/webssh-version:ro
      - ./data:/data
    command:
      - ttyd
      - -W
      - -t
      - copyOnSelect=true
      - -t
      - fontSize=15
      - -t
      - cursorBlink=true
      - -t
      - scrollback=10000
      - -t
      - 'theme={"background":"#1a1b26","foreground":"#c0caf5","cursor":"#c0caf5","cursorAccent":"#1a1b26","selectionBackground":"#33467c","black":"#15161e","red":"#f7768e","green":"#9ece6a","yellow":"#e0af68","blue":"#7aa2f7","magenta":"#bb9af7","cyan":"#7dcfff","white":"#a9b1d6","brightBlack":"#414868","brightRed":"#f7768e","brightGreen":"#9ece6a","brightYellow":"#e0af68","brightBlue":"#7aa2f7","brightMagenta":"#bb9af7","brightCyan":"#7dcfff","brightWhite":"#c0caf5"}'
      - -m
      - "10"
      - bash
      - /usr/local/bin/launcher.sh
    logging: *default-logging

  # Optional: Run Cloudflare Tunnel directly in Docker
  # Set TUNNEL_TOKEN in your .env file and run: docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: webssh-tunnel
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    network_mode: host
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    profiles:
      - tunnel
    logging: *default-logging
