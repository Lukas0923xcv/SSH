map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 1. Extract host domain/ip (without scheme or port) from Origin header
map $http_origin $origin_clean_host {
    default "invalid";
    ""      "none";
    "null"  "null";
    "~*^https?://(?<oh>[^:/]+)(?::[0-9]+)?$" $oh;
}

# 2. Extract host domain/ip (without port) from Host header
map $http_host $host_clean {
    default "";
    "~*^(?<hh>[^:/]+)(?::[0-9]+)?$" $hh;
}

# 3. Extract host domain/ip (without port) from X-Forwarded-Host header
map $http_x_forwarded_host $xfwd_clean {
    default "";
    "~*^(?<xfh>[^:/]+)(?::[0-9]+)?$" $xfh;
}

# 4. Cross-Site WebSocket Hijacking (CSWSH) protection map:
# Concatenation format: "$origin_clean_host#$host_clean#$xfwd_clean"
# Prevents external malicious sites and sandboxed iframes ("Origin: null")
# from initiating unauthorized WebSocket sessions to the terminal.
map "$origin_clean_host#$host_clean#$xfwd_clean" $origin_allowed {
    default 0;

    # 1. No Origin header provided (direct browser navigation, curl, CLI)
    "~^none#" 1;

    # 2. Origin domain matches Host header domain
    "~*^([^#]+)#\1#" 1;

    # 3. Origin domain matches X-Forwarded-Host header domain (reverse proxy / Cloudflare Tunnel)
    "~*^([^#]+)#[^#]*#\1$" 1;

    # 4. Local loopback origins connecting to local loopback hosts (localhost <-> 127.0.0.1)
    "~*^(?:localhost|127\.0\.0\.1)#(?:localhost|127\.0\.0\.1)#" 1;
}

server {
    listen 8888;
    server_name _;
    server_tokens off;
    client_max_body_size 1k;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; font-src 'self' data:; img-src 'self' data:; frame-ancestors 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        # Block cross-origin WebSocket hijacking attempts
        if ($origin_allowed = 0) {
            return 403 "Forbidden: Cross-Origin request blocked.\n";
        }

        proxy_pass http://ttyd:7681;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}