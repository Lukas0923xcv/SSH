map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Extract host:port from Origin header (e.g. http://localhost:8888 -> localhost:8888)
map $http_origin $origin_host {
    default "";
    "~*^https?://(?<extracted_host>[^/]+)$" $extracted_host;
}

# Cross-Site WebSocket Hijacking (CSWSH) protection:
# Compare origin host against incoming Host header ($http_host)
# - Omitted Origin (direct navigation/non-browser): allowed ("~^##")
# - Origin host matches $http_host: allowed
# - Mismatched origins or "Origin: null" (e.g. sandboxed iframes): blocked (default 0)
map "$http_origin#$origin_host#$http_host" $origin_allowed {
    default 0;
    "~^##" 1;
    "~*^[^#]+#([^#]+)#\1$" 1;
}


# Connection limit zone per client IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 8888;
    server_name _;
    server_tokens off;

    # Limit maximum request body size
    client_max_body_size 1m;

    # Limit concurrent connections per IP to prevent connection flooding
    limit_conn conn_limit 50;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; font-src 'self' data:; img-src 'self' data:; frame-ancestors 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        # Block cross-origin WebSocket hijacking attempts
        if ($origin_allowed = 0) {
            return 403 "Forbidden: Cross-Origin request blocked.\n";
        }

        proxy_pass http://ttyd:7681;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}