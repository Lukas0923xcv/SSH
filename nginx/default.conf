map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 1. Extract host domain/ip (without scheme or port) from Origin header
# Supports standard domains, IPv4 addresses, and bracketed IPv6 addresses ([::1])
map $http_origin $origin_clean_host {
    default "invalid";
    ""      "none";
    "null"  "null";
    "~*^https?://(?<oh>\[[0-9a-fA-F:]+\]|[^:/]+)(?::[0-9]+)?$" $oh;
}

# 2. Extract host domain/ip (without port) from Host header
map $http_host $host_clean {
    default "";
    "~*^(?<hh>\[[0-9a-fA-F:]+\]|[^:/]+)(?::[0-9]+)?$" $hh;
}

# 3. Check if Host is a recognized local, private network, or loopback address
map $host_clean $host_is_local {
    default 0;
    "localhost" 1;
    "127.0.0.1" 1;
    "[::1]"     1;
    "~*^10\.[0-9]+\.[0-9]+\.[0-9]+$" 1;
    "~*^172\.(?:1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+$" 1;
    "~*^192\.168\.[0-9]+\.[0-9]+$" 1;
}

# 4. Check whether request originated through a verified Cloudflare Tunnel
map $http_cf_ray $is_cf_tunnel {
    default 1;
    ""      0;
}

# 5. Extract host domain/ip (without port) from X-Forwarded-Host header
map $http_x_forwarded_host $xfwd_clean {
    default "";
    "~*^(?<xfh>\[[0-9a-fA-F:]+\]|[^:/]+)(?::[0-9]+)?$" $xfh;
}

# 6. Cross-Site WebSocket Hijacking (CSWSH) & DNS-Rebinding protection map:
# Concatenation format: "$origin_clean_host#$host_clean#$host_is_local#$is_cf_tunnel#$xfwd_clean"
# Prevents external malicious sites, sandboxed iframes ("Origin: null"),
# and DNS-rebound domains from initiating unauthorized WebSocket sessions.
map "$origin_clean_host#$host_clean#$host_is_local#$is_cf_tunnel#$xfwd_clean" $origin_allowed {
    default 0;

    # 1. No Origin header provided (direct browser navigation, curl, CLI)
    "~^none#" 1;

    # 2. Origin matches Host on verified local / private network host
    "~*^([^#]+)#\1#1#" 1;

    # 3. Origin matches Host when arriving through verified Cloudflare Tunnel
    "~*^([^#]+)#\1#[01]#1#" 1;

    # 4. Origin matches X-Forwarded-Host when arriving through verified Cloudflare Tunnel
    "~*^([^#]+)#[^#]*#[01]#1#\1$" 1;

    # 5. Local loopback origins connecting to local loopback hosts (localhost <-> 127.0.0.1 <-> [::1])
    "~*^(?:localhost|127\.0\.0\.1|\[::1\])#(?:localhost|127\.0\.0\.1|\[::1\])#" 1;
}

# Rate & Connection Limiting Zone (per client IP)
limit_conn_zone $binary_remote_addr zone=webssh_conn_limit:10m;
limit_conn_status 429;

server {
    listen 8888;
    server_name _;
    server_tokens off;
    client_max_body_size 1k;

    # ttyd serves its ~720 KB web client uncompressed; compress it (~4x smaller, faster first load).
    # JSON (e.g. /token) is intentionally excluded.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript;

    # Limit concurrent connections per IP address (DoS mitigation)
    limit_conn webssh_conn_limit 10;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; img-src 'self' data:; frame-ancestors 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        # Block cross-origin WebSocket hijacking and DNS-rebinding attempts
        if ($origin_allowed = 0) {
            return 403 "Forbidden: Cross-Origin request blocked.\n";
        }

        proxy_pass http://ttyd:7681;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}